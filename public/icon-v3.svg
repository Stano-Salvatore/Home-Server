<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nedory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececed"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8727b"/>
      <stop offset="1" stop-color="#d1555f"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background: the launcher masks this to its own shape, so no
       transparent corners for it to pad around. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Subtle grey outline so it reads as a framed icon like the others. -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#c6c6ca" stroke-width="5"/>
  <!-- N: centered in the safe zone, monospace-style stroke, in the app's red. -->
  <path d="M170 342 L170 170 L342 342 L342 170"
        fill="none" stroke="url(#ink)" stroke-width="54"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
